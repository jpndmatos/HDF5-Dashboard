<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HDF5 Dashboard</title>
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<script>try{document.documentElement.dataset.mode=localStorage.getItem('hdf5-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{}</script>
</head><body><div class="app-container"><header><div class="header-content"><div class="brand"><img src="icon.svg" width="36" height="36" alt=""><h1>HDF5 Dashboard</h1></div><div class="controls"><button id="zoomReset" disabled>Reset zoom</button><label class="theme-switch" for="checkbox"><input type="checkbox" id="checkbox">Dark mode</label></div></div></header>
<main><section class="dataset-bar" aria-label="Dataset"><div><strong>data.hdf5</strong><p id="dataset-summary">Reading sensor data…</p></div><span id="status" role="status" aria-live="polite">Loading</span></section>
<section class="chart-wrapper" aria-labelledby="electrical-title"><div class="chart-heading"><h2 id="electrical-title">Temperature &amp; humidity</h2><p>Electrical sensors</p></div><div id="temp-humidity-chart" class="chart-container" role="img" aria-label="Temperature and humidity over the recording"></div></section>
<section class="chart-wrapper" aria-labelledby="heatmap-title"><div class="chart-heading"><h2 id="heatmap-title">Temperature distribution</h2><p>Position across the sensor</p></div><div id="heatmap-chart" class="chart-container heatmap" role="img" aria-label="Temperature by sensor position and elapsed time"></div></section>
<noscript>This dashboard requires JavaScript to display the HDF5 charts.</noscript></main></div><script type="module" src="main.js"></script></body></html>
